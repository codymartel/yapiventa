name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Sin --no-fatal-infos el job falla por los `info` de APIs deprecadas
      # (withOpacity, Radio) que quedan pendientes de migrar.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
