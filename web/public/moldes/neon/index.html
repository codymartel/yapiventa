<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — YapiVenta</title>
  <meta name="description" content="Catálogo web del negocio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body x-data="catalogo" x-init="cargar()">

  <!-- Estado de carga -->
  <div x-show="cargando" class="loader" x-cloak>
    <div class="loader-ring" aria-hidden="true"></div>
    <p>Cargando catálogo…</p>
  </div>

  <div x-show="error" class="error-box" x-cloak
       x-text="'No pudimos cargar el catálogo. ' + error"></div>

  <!-- Header -->
  <header class="header">
    <div class="wrap header-inner">
      <a href="#" class="brand" x-text="negocio.nombre || 'Mi tienda'"></a>
      <nav class="nav">
        <a href="#catalogo">Catálogo</a>
        <a x-show="negocio.direccion" :href="'https://wa.me/' + waSinProducto + '?text=' + encodeURIComponent('Hola, quiero saber tu ubicación')" x-text="negocio.direccion"></a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <!-- Hero -->
    <section class="hero">
      <p class="hero-eyebrow" x-text="negocio.rubro || 'Catálogo'"></p>
      <h1 x-text="negocio.nombre || 'Mi tienda'"></h1>
      <p class="hero-sub" x-show="negocio.direccion" x-text="negocio.direccion"></p>
    </section>

    <!-- Filtros: búsqueda + categorías -->
    <section id="catalogo" class="filtros">
      <label class="busqueda">
        <span class="sr-only">Buscar producto</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/></svg>
        <input type="search" placeholder="Buscar en el catálogo…" x-model="busqueda">
      </label>

      <div class="pills" x-show="categorias.length">
        <button class="pill"
                :class="{ 'pill--activa': categoriaActiva === '' }"
                @click="categoriaActiva = ''">Todos</button>
        <template x-for="cat in categorias" :key="cat">
          <button class="pill"
                  :class="{ 'pill--activa': categoriaActiva === cat }"
                  @click="categoriaActiva = categoriaActiva === cat ? '' : cat"
                  x-text="cat"></button>
        </template>
      </div>

      <p class="resultados" x-show="!cargando">
        <span x-text="filtrados.length"></span>
        <span x-text="filtrados.length === 1 ? 'producto' : 'productos'"></span>
      </p>
    </section>

    <!-- Grid de productos -->
    <section x-show="!cargando && !error" class="grid">
      <article class="card"
               x-show="filtrados.length"
               x-for="p in filtrados"
               :key="p.id"
               @click="abrir(p)">

        <div class="card-img">
          <img x-show="p.urlImagen"
               :src="p.urlImagen"
               :alt="p.nombre"
               loading="lazy"
               @error="p.urlImagen = ''">
          <div x-show="!p.urlImagen" class="card-ph" x-text="iniciales(p.nombre)"></div>
        </div>

        <div class="card-body">
          <p class="card-cat" x-show="p.categoria" x-text="p.categoria"></p>
          <h3 x-text="p.nombre"></h3>
          <p class="card-desc" x-show="p.descripcion" x-text="p.descripcion"></p>
          <div class="card-foot">
            <span class="precio" x-text="fmt(p.precio)"></span>
            <span class="agregar" aria-hidden="true">+</span>
          </div>
        </div>
      </article>
    </section>

    <!-- Sin resultados -->
    <section x-show="!cargando && !error && filtrados.length === 0" class="vacio">
      <p>No encontramos productos que coincidan con tu búsqueda.</p>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer wrap">
    <p>
      <a x-show="negocio.nombre" :href="waGeneral" target="_blank" rel="noopener">
        Escríbenos por WhatsApp
      </a>
      <span x-text="negocio.nombre"></span>
      <span x-show="negocio.direccion"> · <span x-text="negocio.direccion"></span></span>
    </p>
  </footer>

  <!-- Modal de producto -->
  <div class="modal" x-cloak x-show="activo"
       @keydown.escape.window="cerrar()"
       x-transition.opacity.duration.250ms>
    <div class="modal-backdrop" @click="cerrar()"></div>
    <article class="modal-panel" @click.outside="cerrar()"
             x-transition.scale.origin.center.duration.250ms>
      <button class="modal-close" @click="cerrar()" aria-label="Cerrar">&times;</button>

      <div class="modal-img">
        <img x-show="activo.urlImagen" :src="activo.urlImagen" :alt="activo.nombre">
        <div x-show="!activo.urlImagen" class="modal-ph" x-text="iniciales(activo.nombre)"></div>
      </div>

      <div class="modal-body">
        <p class="modal-cat" x-show="activo.categoria" x-text="activo.categoria"></p>
        <h2 x-text="activo.nombre"></h2>
        <p class="modal-desc" x-show="activo.descripcion" x-text="activo.descripcion"></p>

        <div class="modal-meta">
          <span class="precio precio--grande" x-text="fmt(activo.precio)"></span>
          <span class="stock" x-show="!activo.esStockInfinito"
                x-text="'Disponible: ' + activo.stock"></span>
          <span class="stock" x-show="activo.esStockInfinito">En stock</span>
        </div>

        <a class="btn-wa btn-wa--modal"
           :href="waProducto"
           target="_blank" rel="noopener">Pedir por WhatsApp</a>
      </div>
    </article>
  </div>

  <!-- WhatsApp flotante -->
  <a class="btn-wa btn-wa--float"
     x-show="!activo"
     x-cloak
     :href="waGeneral"
     target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 2a8 8 0 1 1-4.1 14.9l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 0 1 12 4Zm-3.2 4.1c-.2 0-.5 0-.7.3-.2.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.9 4.5 4 .6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.3-.2-.6-.4-.3-.1-1.5-.8-1.8-.8-.2-.1-.4-.1-.6.1l-.8.9c-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.8-2c-.2-.5-.4-.4-.6-.4Z"/>
    </svg>
    <span>WhatsApp</span>
  </a>

  <!-- Scripts: orden importante — Alpine al final -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../shared/firebase-config.js"></script>
  <script src="../shared/cargar-negocio.js"></script>
  <script src="script.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</body>
</html>
