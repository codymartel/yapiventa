<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — YapiVenta</title>
  <meta name="description" content="Catálogo web del negocio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body x-data="catalogo">

  <div x-show="cargando" class="loader" x-cloak>
    <div class="loader-plato" aria-hidden="true"></div>
    <p>Calentando el menú…</p>
  </div>

  <div x-show="error" class="error-box" x-cloak
       x-text="'No pudimos cargar el menú. ' + error"></div>

  <!-- Header -->
  <header class="header">
    <div class="wrap header-inner">
      <div>
        <p class="marca-sub" x-show="negocio.rubro" x-text="negocio.rubro"></p>
        <h1 class="marca" x-text="negocio.nombre || 'Mi restaurante'"></h1>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- Presentación -->
    <section class="intro">
      <p x-show="negocio.direccion" x-text="negocio.direccion"></p>
      <p class="intro-luz" x-show="categorias.length" x-cloak>
        Elige un plato y pídelo en un toque.
      </p>
    </section>

    <!-- Categorías (pills con scroll) -->
    <section class="menu-cats" x-show="categorias.length" x-cloak>
      <div class="pills">
        <button class="pill" :class="{ 'pill--activa': categoriaActiva === '' }"
                @click="categoriaActiva = ''">Todo el menú</button>
        <template x-for="cat in categorias" :key="cat">
          <button class="pill" :class="{ 'pill--activa': categoriaActiva === cat }"
                  @click="categoriaActiva = categoriaActiva === cat ? '' : cat"
                  x-text="cat"></button>
        </template>
      </div>
    </section>

    <!-- Grid de platos — fotos protagonistas -->
    <section x-show="!cargando && !error" class="grid">
      <template x-for="p in filtrados" :key="p.id">
        <article class="plato" x-show="filtrados.length" @click="abrir(p)">
          <div class="plato-img">
            <img x-show="p.urlImagen" :src="p.urlImagen" :alt="p.nombre" loading="lazy"
                 @error="ocultarImagen(p)">
            <div x-show="!p.urlImagen" class="plato-ph" x-text="p.nombre.charAt(0)"></div>
          </div>
          <div class="plato-body">
            <h2 x-text="p.nombre"></h2>
            <p class="plato-desc" x-show="p.descripcion" x-text="p.descripcion"></p>
            <div class="plato-foot">
              <span class="precio" x-text="fmt(p.precio)"></span>
              <span class="pedir">Hacer pedido →</span>
            </div>
          </div>
        </article>
      </template>
    </section>

    <section x-show="!cargando && !error && filtrados.length === 0" class="vacio">
      <p>Por ahora no hay platos en esta sección.</p>
    </section>
  </main>

  <footer class="footer wrap">
    <p x-show="negocio.nombre" x-text="negocio.nombre" x-cloak></p>
  </footer>

  <!-- Modal grande: la foto arriba de todo -->
  <div class="modal" x-cloak x-show="activo"
       @keydown.escape.window="cerrar()"
       x-transition:enter.opacity.duration.220ms x-transition:leave.opacity.duration.150ms>
    <div class="modal-backdrop" @click="cerrar()"></div>
    <template x-if="activo">
      <article class="modal-panel" @click.outside="cerrar()"
               x-transition:enter.slide.down.scale.origin.center.duration.300ms
               x-transition:leave.scale.origin.center.duration.150ms>

        <button class="modal-close" @click="cerrar()" aria-label="Cerrar">&times;</button>

        <div class="modal-img">
          <img x-show="activo.urlImagen" :src="activo.urlImagen" :alt="activo.nombre">
          <div x-show="!activo.urlImagen" class="modal-ph" x-text="activo.nombre.charAt(0)"></div>
        </div>

        <div class="modal-body">
          <span class="pill pill--chica" x-show="activo.categoria" x-text="activo.categoria"></span>
          <h3 x-text="activo.nombre"></h3>
          <p class="modal-desc" x-show="activo.descripcion" x-text="activo.descripcion"></p>

          <div class="modal-precio">
            <span class="precio precio--grande" x-text="fmt(activo.precio)"></span>
          </div>

          <a class="btn-pedido" :href="waProducto" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 2a8 8 0 1 1-4.1 14.9l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 0 1 12 4Zm-3.2 4.1c-.2 0-.5 0-.7.3-.2.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.9 4.5 4 .6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.3-.2-.6-.4-.3-.1-1.5-.8-1.8-.8-.2-.1-.4-.1-.6.1l-.8.9c-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.8-2c-.2-.5-.4-.4-.6-.4Z"/>
            </svg>
            Hacer pedido por WhatsApp
          </a>
        </div>
      </article>
    </template>
  </div>

  <!-- WhatsApp flotante -->
  <a class="btn-pedido btn-pedido--float" x-show="!activo" :href="waGeneral"
     target="_blank" rel="noopener" x-cloak>
    <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true">
      <path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 2a8 8 0 1 1-4.1 14.9l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 0 1 12 4Zm-3.2 4.1c-.2 0-.5 0-.7.3-.2.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.9 4.5 4 .6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.3-.2-.6-.4-.3-.1-1.5-.8-1.8-.8-.2-.1-.4-.1-.6.1l-.8.9c-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.8-2c-.2-.5-.4-.4-.6-.4Z"/>
    </svg>
    <span>Hacer pedido</span>
  </a>

  <!-- Scripts: orden importante — Alpine al final -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="../shared/firebase-config.js"></script>
  <script src="../shared/cargar-negocio.js"></script>
  <script src="script.js" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/csp@3.17.2/dist/cdn.min.js"></script>
</body>
</html>
